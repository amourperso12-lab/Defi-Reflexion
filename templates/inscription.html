<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inscription - Défi Réflexion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #2563eb, #111827 60%);

            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;

            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
        }

        .register-button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #4ade80;
            color: #111827;

            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .register-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .links {
            text-align: center;
            margin-top: 20px;
        }

        .links a {
            color: white;
            text-decoration: none;
        }

        .error {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }

        .success {
            background: rgba(34,197,94,0.2);
            border: 1px solid #22c55e;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎮</div>

    <h1>Créer un compte</h1>

    <p class="subtitle">
        Rejoins Défi Réflexion !
    </p>

    {% if erreur %}
        <div class="error">
            {{ erreur }}
        </div>
    {% endif %}

    {% if succes %}
        <div class="success">
            {{ succes }}
        </div>
    {% endif %}

    <form method="POST" action="/inscription">

        <label for="username">
            Nom d'utilisateur
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Choisis un nom"
            required
        >

        <label for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Choisis un mot de passe"
            required
        >

        <label for="password_confirm">
            Confirmer le mot de passe
        </label>

        <input
            type="password"
            id="password_confirm"
            name="password_confirm"
            placeholder="Confirme ton mot de passe"
            required
        >

        <button type="submit" class="register-button">
            🚀 Créer mon compte
        </button>

    </form>

    <div class="links">

        <a href="/connexion">
            🔐 J'ai déjà un compte
        </a>

        <br><br>

        <a href="/">
            🏠 Retour à l'accueil
        </a>

    </div>

</div>

</body>
</html>
