<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Défi Réflexion</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(circle at top, #2563eb, #111827 60%);

            color: white;
        }

        .container {
            width: 90%;
            max-width: 420px;
            padding: 35px;

            background: rgba(255,255,255,0.10);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;

            box-shadow: 0 20px 50px rgba(0,0,0,0.4);
            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 65px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #d1d5db;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 20px;

            border: none;
            border-radius: 10px;

            font-size: 16px;
        }

        .login-button {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #fbbf24;
            color: #111827;

            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;

            color: white;
            text-decoration: none;
        }

        .error {
            background: rgba(239,68,68,0.2);
            border: 1px solid #ef4444;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">👤</div>

    <h1>Connexion</h1>

    <p class="subtitle">
        Connecte-toi à ton compte Défi Réflexion
    </p>

    {% if erreur %}
        <div class="error">
            {{ erreur }}
        </div>
    {% endif %}

    <form method="POST" action="/connexion">

        <label for="username">
            Nom d'utilisateur
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Ton nom d'utilisateur"
            required
        >

        <label for="password">
            Mot de passe
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Ton mot de passe"
            required
        >

        <button type="submit" class="login-button">
            🔐 Se connecter
        </button>

    </form>

    <a href="/" class="back">
        🏠 Retour à l'accueil
    </a>

</div>

</body>
</html>
