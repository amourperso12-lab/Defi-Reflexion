<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Défi Réflexion</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #111827, #1e3a8a);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 900px;
            text-align: center;
        }

        .logo {
            font-size: 70px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .description {
            font-size: 20px;
            color: #d1d5db;
            margin-bottom: 40px;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .btn {
            text-decoration: none;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            background: white;
            color: #1e3a8a;
            transition: 0.2s;
        }

        .btn:hover {
            transform: translateY(-3px);
            opacity: 0.9;
        }

        .features {
            margin-top: 50px;
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .card {
            background: rgba(255,255,255,0.1);
            padding: 25px;
            border-radius: 15px;
            width: 200px;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .card p {
            color: #d1d5db;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">🎲</div>

    <h1>Défi Réflexion</h1>

    <p class="description">
        Teste tes connaissances, relève les défis et deviens le meilleur !
    </p>

    <div class="buttons">
        <a href="#" class="btn">🎮 Jouer</a>
        <a href="#" class="btn">👤 Connexion</a>
        <a href="#" class="btn">🏆 Classement</a>
        <a href="/admin/login" class="btn">🔐 Administration</a>
    </div>

    <div class="features">

        <div class="card">
            <h3>🧠 Questions</h3>
            <p>Teste tes connaissances.</p>
        </div>

        <div class="card">
            <h3>🎯 Défis</h3>
            <p>Relève les défis.</p>
        </div>

        <div class="card">
            <h3>🏆 Classement</h3>
            <p>Compare ton score.</p>
        </div>

    </div>

</div>

</body>
</html>
